app-id: com.unity.UnityHub
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: start-unityhub
separate-locales: false
tags:
  - proprietary
finish-args:
  - --allow=multiarch
  - --device=all
  - --filesystem=host
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=x11
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.gnome.Software
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.kde.kwalletd6
  # Delays sleep with reason “Application cleanup before suspend”.
  # Ideally it would use the inhibit portal, but here we are.
  - --system-talk-name=org.freedesktop.login1
add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '25.08'
  org.freedesktop.Platform.Compat.i386.Debug:
    directory: lib/debug/lib/i386-linux-gnu
    version: '25.08'
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '25.08'
    add-ld-path: .
modules:
  - name: compat
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/i386-linux-gnu /app/lib/debug/lib/i386-linux-gnu

  - shared-modules/glu/glu-9.json
  - openssl-1.1.yaml
  - libxml2.yaml
  - 7zip.yaml

  - name: unityhub
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg
      - install -Dm 755 unityhub.py /app/bin/start-unityhub
      - install -Dm 755 vscode.py /app/bin/code
      - install -Dm 755 blender.py /app/bin/blender
      - install -Dm 755 apply_extra.sh /app/bin/apply_extra
      - install -Dm 755 patch-resources.py /app/bin/patch-resources
      - install -Dm 644 com.unity.UnityHub.appdata.xml /app/share/metainfo/com.unity.UnityHub.appdata.xml
      - install -Dm 644 com.unity.UnityHub.desktop /app/share/applications/com.unity.UnityHub.desktop
      - install -Dm 644 unityhub.png /app/share/icons/hicolor/512x512/apps/com.unity.UnityHub.png
    sources:
      - type: extra-data
        filename: unityhub.deb
        url: https://hub.unity3d.com/linux/repos/deb/pool/main/u/unity/unityhub_amd64/unityhub_3.20.0_amd64.deb
        sha256: 22303da6cd88026011016dd8fe2de01cbb41d630650a7448123e616680999d54
        size: 158826102
        x-checker-data:
          type: debian-repo
          package-name: unityhub
          root: https://hub.unity3d.com/linux/repos/deb
          dist: stable
          component: main
      - type: file
        path: icons/unityhub.png
      - type: file
        path: unityhub.py
      - type: file
        path: vscode.py
      - type: file
        path: blender.py
      - type: file
        path: apply_extra.sh
      - type: file
        path: patch-resources.py
      - type: file
        path: com.unity.UnityHub.appdata.xml
      - type: file
        path: com.unity.UnityHub.desktop
